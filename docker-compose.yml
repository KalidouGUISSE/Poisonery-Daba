version: '3.8'

services:
  # Base de données MongoDB
  mongodb:
    image: mongo:7
    container_name: poissyshop-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: poissyshop
    networks:
      - poissyshop-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: poissyshop-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api
      MONGODB_URI: mongodb://mongodb:27017/poissyshop
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      SALE_DECREMENTS_STOCK: ${SALE_DECREMENTS_STOCK:-false}
    depends_on:
      - mongodb
    networks:
      - poissyshop-network
    volumes:
      - ./backend/.env:/app/.env

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: poissyshop-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: http://backend:4000
      NEXT_PUBLIC_API_MODE: backend
    depends_on:
      - backend
    networks:
      - poissyshop-network

volumes:
  mongodb_data:

networks:
  poissyshop-network:
    driver: bridge