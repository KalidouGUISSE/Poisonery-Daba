services:
  postgres:
    image: postgres:15
    container_name: poissyshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: poissyshop
      POSTGRES_USER: kalidou
      POSTGRES_PASSWORD: kalidou123
    ports:
      - "5434:5432"
    volumes:
      - poissyshop_postgres_data:/var/lib/postgresql/data

volumes:
  poissyshop_postgres_data:
